name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Настроить Pages
        uses: actions/configure-pages@v5
      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
